name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: JavaScript syntax
        shell: pwsh
        run: Get-ChildItem src,qa,test,benchmarks -Recurse -Filter *.mjs | ForEach-Object { node --check $_.FullName }
      - name: Secret hygiene
        shell: pwsh
        run: ./scripts/secret-scan.ps1
